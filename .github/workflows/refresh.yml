# The refresh cycle, off the laptop. Same scripts/refresh.sh that launchd ran, on a machine
# that is never asleep. The pipeline is stateful — workie.db carries dedupe keys, ghost
# absence counts and delistings between cycles — so the file rides the Actions cache from
# run to run, and a lost cache rebuilds it from Turso, which holds every mirrored column.
#
# One writer lineage, ever: the moment this schedule is live, the laptop's launchd agent
# must be off. Two machines each ingesting into their own workie.db assign different ids to
# new postings, and each push then deletes the other's rows as strays.
name: refresh
on:
  schedule:
    # Avoid the top-of-hour peak. GitHub can still delay or skip scheduled runs.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      catch_up:
        description: Complete resumable catalog imports within the runner time budget
        type: boolean
        default: false
      linkcheck_ids:
        description: Optional comma-separated posting IDs to verify before publishing
        type: string
        default: ''

concurrency:
  group: refresh
  cancel-in-progress: false # a running ingest finishes; the next tick waits behind it

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # a plain cycle is ~10 min; the weekly linkcheck budgets 90 inside refresh.sh
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
      JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
      USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A cache entry is immutable, so every run saves under its own id and restore takes
      # the newest by prefix. The linkcheck stamp travels with the db so "weekly" survives
      # the runner being stateless.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            workie.db
            logs/.linkcheck-stamp
          key: workie-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: workie-db-

      - name: Validate cached writer state against Turso
        id: bootstrap
        run: |
          cold=0
          if [ ! -f workie.db ]; then cold=1; fi
          node scripts/pull-remote.ts --check-cache
          if [ "$cold" = 1 ]; then
            # A cold start should not also be a 90-minute linkcheck.
            mkdir -p logs && touch logs/.linkcheck-stamp
          fi

      # Claims a pending hosted-button request if one is waiting, then runs the ordinary
      # cycle either way — ingest, enrich, weekly linkcheck, mirror to Turso.
      - name: Verify selected application links
        if: inputs.linkcheck_ids != ''
        env:
          LINKCHECK_IDS: ${{ inputs.linkcheck_ids }}
        run: |
          node --input-type=module <<'JS'
          import { inArray } from 'drizzle-orm';
          import { openDb } from './lib/db/index.ts';
          import { postings } from './lib/db/schema.ts';
          import { createRuntime } from './lib/runtime.ts';
          import { parseAuditedIds, runLinkcheck, formatSummary } from './scripts/linkcheck.ts';
          const ids = parseAuditedIds(process.env.LINKCHECK_IDS);
          const db = openDb(undefined, { migrate: true });
          const rows = db.select({ id: postings.id, track: postings.track,
            delistedAt: postings.delistedAt, reason: postings.delistedReason })
            .from(postings).where(inArray(postings.id, ids)).all();
          if (rows.length !== ids.length) throw new Error('Some requested posting IDs do not exist');
          const checkable = rows.filter(r => r.track && (!r.delistedAt || r.reason === 'linkcheck')).map(r => r.id);
          if (checkable.length) {
            console.log(formatSummary(await runLinkcheck(db, createRuntime(), { ids: checkable }), false));
          } else {
            console.log('Selected postings are already excluded from the board');
          }
          JS

      - name: Run refresh cycle
        run: |
          args=(--always)
          if [ "$CATCH_UP" = "true" ]; then args+=(--catch-up); fi
          node scripts/claim-refresh.ts "${args[@]}"
        env:
          CATCH_UP: ${{ inputs.catch_up }}

      - name: Collector health
        if: always()
        run: npm run status

      - name: Checkpoint cached database
        id: checkpoint
        if: always() && steps.bootstrap.outcome == 'success'
        run: |
          node --input-type=module <<'JS'
          import Database from 'better-sqlite3';
          const db = new Database('workie.db', { fileMustExist: true });
          const result = db.pragma('wal_checkpoint(TRUNCATE)');
          db.close();
          if (result.some(row => row.busy !== 0)) throw new Error('Database checkpoint is still busy');
          console.log('Committed database state is checkpointed for cache recovery');
          JS

      - name: Save state
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            workie.db
            logs/.linkcheck-stamp
          key: workie-db-${{ github.run_id }}-${{ github.run_attempt }}

      # The summary lines FIRST, then the tail. A blind `tail -40` is worthless on the run
      # that matters: when the mirror throws, its stack trace is longer than 40 lines and
      # buries every connector result, the ingest count and the exit codes underneath it.
      - name: Cycle log
        if: always()
        run: |
          f=$(ls -t logs/refresh-*.log 2>/dev/null | head -1) || true
          if [ -z "$f" ]; then echo "no cycle log written"; exit 0; fi
          echo "── cycle ──"
          grep -aE '"event":"summary"|ingest exit=|enrich exit=|push:remote exit=|linkcheck exit=|refresh-claim-failed|cycle (start|end)' "$f" | tail -20 || true
          echo "── connectors that did not succeed ──"
          grep -aoE '"connector":"[a-z0-9-]+","status":"(error|skipped)"[^}]*' "$f" | tail -15 || true
          echo "── tail ──"
          tail -25 "$f" || true
